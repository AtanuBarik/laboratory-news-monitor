name: Apply verified article summaries

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-verified-article-summaries.yml

permissions:
  contents: write

concurrency:
  group: apply-verified-article-summaries
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Map reviewed summaries to news records
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          import json
          import re
          import urllib.request
          from pathlib import Path

          base = 'https://raw.githubusercontent.com/AtanuBarik/quest-intelligence-360/main/data'
          urls = [f'{base}/laboratory-article-summaries-{part:02d}.b64' for part in range(1, 4)]
          encoded = ''
          for url in urls:
              with urllib.request.urlopen(url, timeout=30) as response:
                  encoded += response.read().decode('utf-8').strip()

          payload = json.loads(gzip.decompress(base64.b64decode(encoded)).decode('utf-8'))
          if payload.get('item_count') != 82 or len(payload.get('summaries', {})) != 82:
              raise SystemExit('Expected exactly 82 reviewed article summaries.')

          def normalize(value):
              return re.sub(r'[^a-z0-9]+', ' ', str(value or '').lower()).strip()

          by_title = {normalize(record['title']): record for record in payload['summaries'].values()}
          news_path = Path('data/news.json')
          news = json.loads(news_path.read_text(encoding='utf-8'))
          matched = 0
          matched_titles = []
          for item in news.get('items', []):
              record = by_title.get(normalize(item.get('title')))
              if not record:
                  continue
              matched += 1
              matched_titles.append(record['title'])
              item['article_summary'] = record['summary']
              item['chatgpt_summary'] = record['summary']
              item['summary_provider'] = 'Verified article-content research'
              item['summary_updated_at'] = payload['updated_at']
              item['summary_article_url'] = record.get('article_url') or ''
              item['summary_evidence_url'] = record.get('evidence_url') or ''
              item['summary_retrieval_status'] = record.get('retrieval_status') or ''
              evidence = []
              for candidate in (record.get('article_url'), record.get('evidence_url')):
                  if candidate and candidate not in evidence:
                      evidence.append(candidate)
              item['summary_evidence'] = evidence
              item['summary_verification'] = record.get('verification') or 'article-content-reviewed'

          if matched != 82:
              missing = sorted(set(record['title'] for record in payload['summaries'].values()) - set(matched_titles))
              raise SystemExit(f'Mapped {matched}/82 summaries. Missing titles: {missing}')

          news['reviewed_summary_count'] = matched
          news['reviewed_summaries_updated_at'] = payload['updated_at']
          news['reviewed_summaries_updated_at_display'] = payload['updated_at_display']
          news_path.write_text(json.dumps(news, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          Path('data/article_summaries.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')
          script_tag = '<script src="frontend-verified-summaries.js?v=20260810a"></script>'
          if script_tag not in html:
              if '</body>' not in html:
                  raise SystemExit('index.html has no closing body tag.')
              html = html.replace('</body>', script_tag + '\n</body>', 1)
              index_path.write_text(html, encoding='utf-8')

          print(f'Mapped {matched} reviewed summaries to {matched} news records.')
          PY

          node --check frontend-verified-summaries.js

      - name: Commit mapped summaries and frontend update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'laboratory-news-summary-mapper[bot]'
          git config user.email 'laboratory-news-summary-mapper[bot]@users.noreply.github.com'
          git add data/news.json data/article_summaries.json index.html frontend-verified-summaries.js
          if git diff --cached --quiet; then
            echo 'No summary mapping changes to commit.'
            exit 0
          fi
          git commit -m 'Map 82 verified article summaries to laboratory news'
          git push origin main
