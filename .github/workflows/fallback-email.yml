name: Fallback laboratory email

on:
  workflow_dispatch:
  schedule:
    # Runs after the ChatGPT Scheduled Task window. If ChatGPT already committed summaries,
    # the normal collector workflow will have sent/marked those items and this exits quietly.
    - cron: "10 1,7,13,19 * * *"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

concurrency:
  group: update-laboratory-news
  cancel-in-progress: false

jobs:
  fallback-email:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out latest repository state
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply any ChatGPT summaries written since collection
        run: PYTHONPATH=scripts python scripts/apply_chatgpt_summaries.py

      - name: Rebuild pruned knowledge and ChatGPT queue
        run: |
          PYTHONPATH=scripts python scripts/prune_news.py
          PYTHONPATH=scripts python scripts/prepare_chatgpt_queue.py

      - name: Check Gemini fallback availability
        id: ai_worker
        env:
          AI_WORKER_URL: ${{ vars.AI_WORKER_URL || 'https://laboratory-news-ai.atanu-barik.workers.dev' }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          output = os.environ["GITHUB_OUTPUT"]
          ready = False
          reason = ""
          try:
              req = urllib.request.Request(os.environ["AI_WORKER_URL"], headers={"Accept":"application/json","User-Agent":"QuestFallbackEmail/1.0"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  payload = json.loads(response.read().decode("utf-8"))
              required = {"email_article_summary","direct_publisher_page_read","generate_content_search_fallback","model_and_tool_fallbacks"}
              missing = sorted(required - set(payload.get("capabilities") or []))
              ready = not missing and bool(payload.get("gemini_configured"))
              if missing: reason = "missing capabilities: " + ", ".join(missing)
              elif not payload.get("gemini_configured"): reason = "GEMINI_API_KEY not configured"
          except Exception as exc:
              reason = str(exc)
          print("Gemini fallback ready:" if ready else "Gemini fallback unavailable:", "yes" if ready else reason)
          with open(output, "a", encoding="utf-8") as handle:
              handle.write(f"ready={'true' if ready else 'false'}\n")
          PY

      - name: Send any still-unnotified alerts
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_BCC: ${{ secrets.EMAIL_BCC }}
          EMAIL_SENDER_NAME: ${{ vars.EMAIL_SENDER_NAME || 'Quest Updates' }}
          AI_WORKER_URL: ${{ vars.AI_WORKER_URL || 'https://laboratory-news-ai.atanu-barik.workers.dev' }}
          DISABLE_GEMINI: ${{ steps.ai_worker.outputs.ready != 'true' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          SEND_TEST_EMAIL: false
        run: PYTHONPATH=scripts python scripts/email_dispatch_hybrid.py

      - name: Commit fallback email state and enriched dashboard data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/notified_ids.json data/email_status.json data/chatgpt_queue.json knowledge
          if git diff --cached --quiet; then
            echo "No fallback state changes to commit."
            exit 0
          fi
          git commit -m "Update fallback email and ChatGPT enrichment state"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
