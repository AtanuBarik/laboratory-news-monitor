name: Send ChatGPT-summarized laboratory email alerts

on:
  workflow_dispatch:
  schedule:
    # Runs after the ChatGPT Scheduled Task window. Articles remain unnotified until
    # a verified ChatGPT summary is available, then this workflow sends them.
    - cron: "10 1,7,13,19 * * *"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

concurrency:
  group: update-laboratory-news
  cancel-in-progress: false

jobs:
  email-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out latest repository state
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply verified ChatGPT summaries written since collection
        run: PYTHONPATH=scripts python scripts/apply_chatgpt_summaries.py

      - name: Rebuild pruned knowledge and ChatGPT queue
        run: |
          PYTHONPATH=scripts python scripts/prune_news.py
          PYTHONPATH=scripts python scripts/prepare_chatgpt_queue.py

      - name: Send new articles with verified ChatGPT summaries
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_BCC: ${{ secrets.EMAIL_BCC }}
          EMAIL_SENDER_NAME: ${{ vars.EMAIL_SENDER_NAME || 'Quest Updates' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          SEND_TEST_EMAIL: false
        run: PYTHONPATH=scripts python scripts/email_dispatch_hybrid.py

      - name: Commit email state and ChatGPT-enriched dashboard data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/notified_ids.json data/email_status.json data/chatgpt_queue.json knowledge
          if git diff --cached --quiet; then
            echo "No email state changes to commit."
            exit 0
          fi
          git commit -m "Update ChatGPT-summarized email alert state"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
