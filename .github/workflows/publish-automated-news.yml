name: Publish laboratory monitor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - frontend-verified-summaries.js
      - data/news.json
      - data/email_status.json
      - data/workflow_health.json
      - data/chatgpt_summaries.json
      - data/chatgpt_strategic_synthesis.json
      - knowledge/**
      - assets/email-logos/rendered/**
      - assets/email-icons/rendered/**
      - .github/workflows/publish-automated-news.yml
  workflow_run:
    workflows: ["Update laboratory news", "Fallback laboratory email"]
    types: [completed]

permissions:
  contents: write
  pages: write

concurrency:
  group: laboratory-branch-pages
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Apply reviewed article summaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          import json
          import re
          import urllib.request
          from pathlib import Path

          base = 'https://raw.githubusercontent.com/AtanuBarik/quest-intelligence-360/main/data'
          urls = [f'{base}/laboratory-article-summaries-{part:02d}.b64' for part in range(1, 4)]
          encoded = ''
          for url in urls:
              with urllib.request.urlopen(url, timeout=30) as response:
                  encoded += response.read().decode('utf-8').strip()

          payload = json.loads(gzip.decompress(base64.b64decode(encoded)).decode('utf-8'))
          summaries = payload.get('summaries') or {}
          if payload.get('item_count') != 82 or len(summaries) != 82:
              raise SystemExit('Expected exactly 82 reviewed article summaries.')

          def normalize(value):
              return re.sub(r'[^a-z0-9]+', ' ', str(value or '').lower()).strip()

          by_title = {normalize(record['title']): record for record in summaries.values()}
          news_path = Path('data/news.json')
          news = json.loads(news_path.read_text(encoding='utf-8'))
          matched = 0
          matched_titles = set()
          for item in news.get('items', []):
              record = by_title.get(normalize(item.get('title')))
              if not record:
                  continue
              matched += 1
              matched_titles.add(record['title'])
              item['article_summary'] = record['summary']
              item['chatgpt_summary'] = record['summary']
              item['summary_provider'] = 'Verified article-content research'
              item['summary_updated_at'] = payload['updated_at']
              item['summary_article_url'] = record.get('article_url') or ''
              item['summary_evidence_url'] = record.get('evidence_url') or ''
              item['summary_retrieval_status'] = record.get('retrieval_status') or ''
              item['summary_verification'] = record.get('verification') or 'article-content-reviewed'
              evidence = []
              for candidate in (record.get('article_url'), record.get('evidence_url')):
                  if candidate and candidate not in evidence:
                      evidence.append(candidate)
              item['summary_evidence'] = evidence

          if matched != 82:
              missing = sorted(record['title'] for record in summaries.values() if record['title'] not in matched_titles)
              raise SystemExit(f'Mapped {matched}/82 summaries. Missing titles: {missing}')

          news['reviewed_summary_count'] = matched
          news['reviewed_summaries_updated_at'] = payload['updated_at']
          news['reviewed_summaries_updated_at_display'] = payload['updated_at_display']
          news_path.write_text(json.dumps(news, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          Path('data/article_summaries.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')
          script_tag = '<script src="frontend-verified-summaries.js?v=20260810a"></script>'
          if script_tag not in html:
              if '</body>' not in html:
                  raise SystemExit('index.html has no closing body tag.')
              html = html.replace('</body>', script_tag + '\n</body>', 1)
              index_path.write_text(html, encoding='utf-8')

          print('Mapped reviewed summaries:', matched)
          PY
          node --check frontend-verified-summaries.js

      - name: Validate and prepare static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/data _site/assets/email-logos/rendered _site/assets/email-icons/rendered _site/knowledge
          cp index.html _site/index.html
          cp frontend-verified-summaries.js _site/frontend-verified-summaries.js
          cp data/news.json _site/data/news.json
          cp data/article_summaries.json _site/data/article_summaries.json
          if [ -f data/email_status.json ]; then cp data/email_status.json _site/data/email_status.json; fi
          if [ -f data/workflow_health.json ]; then cp data/workflow_health.json _site/data/workflow_health.json; fi
          if [ -f data/chatgpt_summaries.json ]; then cp data/chatgpt_summaries.json _site/data/chatgpt_summaries.json; fi
          if [ -f data/chatgpt_strategic_synthesis.json ]; then cp data/chatgpt_strategic_synthesis.json _site/data/chatgpt_strategic_synthesis.json; fi
          cp -R assets/email-logos/rendered/. _site/assets/email-logos/rendered/
          cp -R assets/email-icons/rendered/. _site/assets/email-icons/rendered/
          cp -R knowledge/. _site/knowledge/
          touch _site/.nojekyll
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('_site/data/news.json').read_text(encoding='utf-8'))
          items = payload.get('items') or []
          if not isinstance(items, list):
              raise SystemExit('data/news.json has an invalid items field')
          reviewed = [item for item in items if item.get('article_summary')]
          if len(reviewed) != 82:
              raise SystemExit(f'Expected 82 mapped summaries in published data, found {len(reviewed)}')
          json.loads(Path('_site/data/article_summaries.json').read_text(encoding='utf-8'))
          for optional in ('email_status.json','workflow_health.json','chatgpt_summaries.json','chatgpt_strategic_synthesis.json'):
              path = Path('_site/data') / optional
              if path.exists():
                  json.loads(path.read_text(encoding='utf-8'))
          print('Prepared news records:', len(items))
          print('Reviewed article summaries:', len(reviewed))
          print('Repository timestamp:', payload.get('generated_at_display'))
          print('Published company logos:', len(list(Path('_site/assets/email-logos/rendered').glob('*'))))
          print('Published category icons:', len(list(Path('_site/assets/email-icons/rendered').glob('*'))))
          PY

      - name: Publish files to gh-pages branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'laboratory-pages[bot]'
          git config user.email 'laboratory-pages[bot]@users.noreply.github.com'
          git fetch origin gh-pages:gh-pages
          rm -rf /tmp/laboratory-pages
          git worktree add /tmp/laboratory-pages gh-pages
          find /tmp/laboratory-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$GITHUB_WORKSPACE/_site/." /tmp/laboratory-pages/
          cd /tmp/laboratory-pages
          git add -A
          if git diff --cached --quiet; then
            echo 'Published site already matches main.'
            exit 0
          fi
          git commit -m "Publish laboratory monitor from ${GITHUB_SHA::7}"
          git push origin gh-pages

      - name: Request Pages build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds"
          echo
          echo 'Requested one Pages build from gh-pages.'
