name: Publish laboratory monitor

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - index.html
  workflow_run:
    workflows:
      - Update laboratory news
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

# Do not cancel a Pages deployment after GitHub has accepted the artifact.
# A newer run waits for the current production deployment to finish.
concurrency:
  group: laboratory-github-pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build minimal published site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/news.json _site/data/news.json
          touch _site/.nojekyll
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('_site/data/news.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          items = payload.get('items') or []
          if not isinstance(items, list):
              raise SystemExit('data/news.json has an invalid items field')
          print('Published news records:', len(items))
          PY
          du -sh _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - name: Deploy laboratory monitor
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 900000
          error_count: 20
          reporting_interval: 5000
