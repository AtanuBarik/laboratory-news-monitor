name: Publish laboratory monitor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - data/news.json
      - data/workflow_health.json
      - knowledge/**
      - assets/email-logos/rendered/**
      - assets/email-icons/rendered/**
      - .github/workflows/publish-automated-news.yml
  workflow_run:
    workflows: ["Update laboratory news"]
    types: [completed]

permissions:
  contents: write
  pages: write

concurrency:
  group: laboratory-branch-pages
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Validate and prepare static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/data _site/assets/email-logos/rendered _site/assets/email-icons/rendered _site/knowledge
          cp index.html _site/index.html
          cp data/news.json _site/data/news.json
          if [ -f data/workflow_health.json ]; then cp data/workflow_health.json _site/data/workflow_health.json; fi
          cp -R assets/email-logos/rendered/. _site/assets/email-logos/rendered/
          cp -R assets/email-icons/rendered/. _site/assets/email-icons/rendered/
          cp -R knowledge/. _site/knowledge/
          touch _site/.nojekyll
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('_site/data/news.json').read_text(encoding='utf-8'))
          items = payload.get('items') or []
          if not isinstance(items, list):
              raise SystemExit('data/news.json has an invalid items field')
          print('Prepared news records:', len(items))
          print('Repository timestamp:', payload.get('generated_at_display'))
          print('Published company logos:', len(list(Path('_site/assets/email-logos/rendered').glob('*'))))
          print('Published category icons:', len(list(Path('_site/assets/email-icons/rendered').glob('*'))))
          PY

      - name: Publish files to gh-pages branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'laboratory-pages[bot]'
          git config user.email 'laboratory-pages[bot]@users.noreply.github.com'
          git fetch origin gh-pages:gh-pages
          rm -rf /tmp/laboratory-pages
          git worktree add /tmp/laboratory-pages gh-pages
          find /tmp/laboratory-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$GITHUB_WORKSPACE/_site/." /tmp/laboratory-pages/
          cd /tmp/laboratory-pages
          git add -A
          if git diff --cached --quiet; then
            echo 'Published site already matches main.'
            exit 0
          fi
          git commit -m "Publish laboratory monitor from ${GITHUB_SHA::7}"
          git push origin gh-pages

      - name: Request Pages build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds"
          echo
          echo 'Requested one Pages build from gh-pages.'
