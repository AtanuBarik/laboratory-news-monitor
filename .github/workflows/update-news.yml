name: Update laboratory news

on:
  workflow_dispatch:
  schedule:
    # Every six hours. GitHub Actions cron uses UTC.
    - cron: "30 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-laboratory-news
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch news
        run: python scripts/fetch_news.py

      - name: Commit updated data
        run: |
          if git diff --quiet -- data/news.json knowledge.html; then
            echo "No news-data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json knowledge.html
          git commit -m "Update laboratory news"
          git push
