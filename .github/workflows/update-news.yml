name: Update laboratory news

on:
  workflow_dispatch:
    inputs:
      send_test_email:
        description: "Send a test email using the five latest items"
        required: false
        type: boolean
        default: false

  repository_dispatch:
    types:
      - refresh_news

  schedule:
    # Every six hours at minute 30. GitHub Actions cron uses UTC.
    - cron: "30 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-laboratory-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # Full history is required when the workflow rebases before pushing.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build hosted email logo files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/email-logos/rendered
          for encoded in assets/email-logos/*.jpg.b64; do
            filename="$(basename "$encoded" .b64)"
            base64 --decode "$encoded" > "assets/email-logos/rendered/$filename"
          done
          ls -lh assets/email-logos/rendered

      - name: Fetch news and build knowledge files
        run: python scripts/fetch_news.py

      - name: Email newly identified items
        env:
          EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER || 'auto' }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_BCC: ${{ secrets.EMAIL_BCC }}
          EMAIL_SENDER_NAME: ${{ vars.EMAIL_SENDER_NAME || 'Quest Updates' }}
          AI_WORKER_URL: ${{ vars.AI_WORKER_URL || 'https://laboratory-news-ai.atanu-barik.workers.dev' }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          SEND_TEST_EMAIL: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test_email || false }}
        run: python scripts/email_new_items.py

      - name: Commit updated data, hosted logos, and notification state
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/news.json \
            data/notified_ids.json \
            data/email_status.json \
            knowledge \
            assets/email-logos/rendered

          if git diff --cached --quiet; then
            echo "No repository changes to commit."
            exit 0
          fi

          git commit -m "Update laboratory news and email state"

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt} of 3"
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "The generated files conflicted with newer changes on main. Start a new workflow run."
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Repository update pushed successfully."
              exit 0
            fi

            echo "Main changed again before the push. Retrying..."
            sleep $((attempt * 2))
          done

          echo "Unable to push after three attempts."
          exit 1
