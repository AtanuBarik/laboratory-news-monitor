name: Update laboratory news

on:
  workflow_dispatch:
    inputs:
      send_test_email:
        description: "Send a test email using the five latest items"
        required: false
        type: boolean
        default: false

  repository_dispatch:
    types:
      - refresh_news

  schedule:
    # Every six hours at minute 30. GitHub Actions cron uses UTC.
    - cron: "30 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-laboratory-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build hosted email image files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import binascii
          import re
          from pathlib import Path

          jobs = [
              (Path("assets/email-logos"), "*.jpg.b64", Path("assets/email-logos/rendered"), b"\xff\xd8\xff", "JPEG"),
              (Path("assets/email-icons"), "*.png.b64", Path("assets/email-icons/rendered"), b"\x89PNG\r\n\x1a\n", "PNG"),
          ]

          def decode_file(
              encoded_path: Path,
              output_dir: Path,
              signature: bytes,
              kind: str,
          ) -> bool:
              try:
                  raw = encoded_path.read_text(encoding="utf-8-sig").strip()
                  if raw.lower().startswith("data:") and "," in raw:
                      raw = raw.split(",", 1)[1]

                  cleaned = re.sub(r"[^A-Za-z0-9+/=]", "", raw).rstrip("=")
                  if len(cleaned) % 4 == 1:
                      raise ValueError(
                          f"invalid character count {len(cleaned)}; Base64 length cannot be 1 modulo 4"
                      )
                  cleaned += "=" * (-len(cleaned) % 4)
                  image_bytes = base64.b64decode(cleaned, validate=True)

                  if len(image_bytes) < 100 or not image_bytes.startswith(signature):
                      raise ValueError(
                          f"decoded output is not a valid {kind} ({len(image_bytes)} bytes)"
                      )

                  output_dir.mkdir(parents=True, exist_ok=True)
                  output_path = output_dir / encoded_path.name.removesuffix(".b64")
                  output_path.write_bytes(image_bytes)
                  print(
                      f"Decoded {encoded_path.name} -> {output_path} "
                      f"({len(image_bytes):,} bytes)"
                  )
                  return True
              except (OSError, binascii.Error, ValueError) as exc:
                  print(f"::warning file={encoded_path}::Skipped invalid {kind} image: {exc}")
                  return False

          total_decoded = 0
          total_skipped = 0

          for source_dir, pattern, output_dir, signature, kind in jobs:
              encoded_files = sorted(source_dir.glob(pattern))
              if not encoded_files:
                  raise SystemExit(f"No {kind} source files found in {source_dir}.")

              kind_decoded = 0
              for encoded_path in encoded_files:
                  if decode_file(encoded_path, output_dir, signature, kind):
                      kind_decoded += 1
                      total_decoded += 1
                  else:
                      total_skipped += 1

              if kind_decoded == 0:
                  raise SystemExit(
                      f"None of the {kind} source files in {source_dir} could be decoded."
                  )

          print(
              f"Image build complete: {total_decoded} decoded, "
              f"{total_skipped} skipped."
          )
          PY

          ls -lh assets/email-logos/rendered
          ls -lh assets/email-icons/rendered

      - name: Fetch news and build knowledge files
        run: python scripts/fetch_news.py

      - name: Email newly identified items
        env:
          EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER || 'auto' }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_BCC: ${{ secrets.EMAIL_BCC }}
          EMAIL_SENDER_NAME: ${{ vars.EMAIL_SENDER_NAME || 'Quest Updates' }}
          AI_WORKER_URL: ${{ vars.AI_WORKER_URL || 'https://laboratory-news-ai.atanu-barik.workers.dev' }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          SEND_TEST_EMAIL: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test_email || false }}
        run: python scripts/email_new_items.py

      - name: Commit updated data, hosted images, and notification state
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/news.json \
            data/notified_ids.json \
            data/email_status.json \
            knowledge \
            assets/email-logos/rendered \
            assets/email-icons/rendered

          if git diff --cached --quiet; then
            echo "No repository changes to commit."
            exit 0
          fi

          git commit -m "Update laboratory news and email state"

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt} of 3"
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "The generated files conflicted with newer changes on main. Start a new workflow run."
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Repository update pushed successfully."
              exit 0
            fi

            echo "Main changed again before the push. Retrying..."
            sleep $((attempt * 2))
          done

          echo "Unable to push after three attempts."
          exit 1
