name: Update laboratory news

on:
  workflow_dispatch:
    inputs:
      send_test_email:
        description: "Send a test email using the five latest items"
        required: false
        type: boolean
        default: false

  repository_dispatch:
    types:
      - refresh_news

  schedule:
    # Every six hours at minute 30. GitHub Actions cron uses UTC.
    - cron: "30 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-laboratory-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch news and build knowledge files
        run: python scripts/fetch_news.py

      - name: Email newly identified items
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          EMAIL_TO: atanu.barik@evalueserve.com,atanu.barik@ymail.com
          SEND_TEST_EMAIL: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test_email || false }}
        run: python scripts/email_new_items.py

      - name: Commit updated data and notification state
        run: |
          if git diff --quiet -- data/news.json data/notified_ids.json data/email_status.json knowledge; then
            echo "No repository changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/notified_ids.json data/email_status.json knowledge
          git commit -m "Update laboratory news and email state"
          git push
