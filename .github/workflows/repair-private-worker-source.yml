name: Repair private Worker news source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-private-worker-source.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Point Worker at the public Quest mirror with fallback
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('cloudflare-worker.js')
          text = path.read_text(encoding='utf-8')
          old_constant = 'const NEWS_URL = "https://raw.githubusercontent.com/AtanuBarik/laboratory-news-monitor/main/data/news.json";'
          new_constant = '''const NEWS_URLS = [
            "https://atanubarik.github.io/quest-intelligence-360/data/laboratory-news.json",
            "https://raw.githubusercontent.com/AtanuBarik/laboratory-news-monitor/main/data/news.json",
          ];'''
          old_fetch = '''async function fetchRepository() {
            const response = await fetch(`${NEWS_URL}?cache=${Date.now()}`, { headers: { Accept: "application/json" } });
            if (!response.ok) throw new Error(`GitHub repository returned HTTP ${response.status}.`);
            return response.json();
          }'''
          new_fetch = '''async function fetchRepository() {
            const failures = [];
            for (const source of NEWS_URLS) {
              try {
                const response = await fetch(`${source}?cache=${Date.now()}`, { headers: { Accept: "application/json" } });
                if (!response.ok) {
                  failures.push(`${source}: HTTP ${response.status}`);
                  continue;
                }
                const payload = await response.json();
                if (Array.isArray(payload?.items) && payload.items.length) return payload;
                failures.push(`${source}: empty or invalid items`);
              } catch (error) {
                failures.push(`${source}: ${error instanceof Error ? error.message : String(error)}`);
              }
            }
            throw new Error(`No laboratory news source is available. ${failures.join(" | ")}`);
          }'''
          if old_constant not in text:
              raise SystemExit('Expected NEWS_URL constant was not found')
          if old_fetch not in text:
              raise SystemExit('Expected fetchRepository function was not found')
          text = text.replace(old_constant, new_constant, 1)
          text = text.replace('const WORKER_VERSION = "2026-08-07.2";', 'const WORKER_VERSION = "2026-08-08.3";', 1)
          text = text.replace(old_fetch, new_fetch, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate Worker source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'quest-intelligence-360/data/laboratory-news.json' cloudflare-worker.js
          grep -q 'const NEWS_URLS' cloudflare-worker.js
          grep -q '2026-08-08.3' cloudflare-worker.js

      - name: Commit repair and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'laboratory-worker-repair[bot]'
          git config user.email 'laboratory-worker-repair[bot]@users.noreply.github.com'
          rm .github/workflows/repair-private-worker-source.yml
          git add cloudflare-worker.js .github/workflows/repair-private-worker-source.yml
          git commit -m 'Use Quest public mirror for private-repository Worker data'
          git pull --rebase origin main
          git push origin HEAD:main
